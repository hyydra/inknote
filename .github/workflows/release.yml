name: Publish GitHub Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
      - name: Configure Android signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing required Android signing secret: $name" >&2
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/release.jks
          test -s android/release.jks || { echo "Decoded Android keystore is empty"; exit 1; }
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=release.jks
          EOF
      - run: flutter pub get
      - name: Build universal Android APK
        run: flutter build apk --release --dart-define=APP_VERSION=${GITHUB_REF_NAME#v}
      - run: cp build/app/outputs/flutter-apk/app-release.apk Pennino-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: Pennino-Android.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
      - run: flutter pub get
      - name: Build Windows app
        shell: pwsh
        run: flutter build windows --release --dart-define=APP_VERSION=$($env:GITHUB_REF_NAME.TrimStart('v'))
      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          & $iscc "/DMyAppVersion=$($env:GITHUB_REF_NAME.TrimStart('v'))" installer/pennino.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item artifacts/Pennino-Windows-Setup.exe Pennino-Windows-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: Pennino-Windows-Setup.exe

  publish:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" Pennino-Android.apk Pennino-Windows-Setup.exe --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Pennino ${GITHUB_REF_NAME#v}" --latest
          else
            gh release create "$GITHUB_REF_NAME" Pennino-Android.apk Pennino-Windows-Setup.exe --repo "$GITHUB_REPOSITORY" --title "Pennino ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag
          fi
