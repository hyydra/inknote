name: Publish GitHub Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
      - name: Configure Android signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing Android signing secrets"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > android/inknote-release.jks
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=inknote-release.jks
          EOF
      - run: flutter pub get
      - name: Build universal Android APK
        run: flutter build apk --release --dart-define=INKNOTE_VERSION=${GITHUB_REF_NAME#v}
      - run: cp build/app/outputs/flutter-apk/app-release.apk InkNote-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: InkNote-Android.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
      - run: flutter pub get
      - name: Build Windows app
        shell: pwsh
        run: flutter build windows --release --dart-define=INKNOTE_VERSION=$($env:GITHUB_REF_NAME.TrimStart('v'))
      - name: Package portable Windows app
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath InkNote-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: InkNote-Windows.zip

  publish:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" InkNote-Android.apk InkNote-Windows.zip --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
