name: Build Pennino

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter test widget_test/editor_gesture_test.dart
      - run: flutter build apk --debug

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
      - name: Install Linux build dependencies
        run: |
          for attempt in 1 2 3; do
            if timeout 180s sudo apt-get update \
                -o Acquire::Retries=3 \
                -o Acquire::ForceIPv4=true \
                -o Acquire::http::Timeout=30 \
                -o DPkg::Lock::Timeout=60 && \
              timeout 180s sudo apt-get install -y --no-install-recommends \
                -o Acquire::Retries=3 \
                -o Acquire::ForceIPv4=true \
                -o Acquire::http::Timeout=30 \
                -o DPkg::Lock::Timeout=60 \
                libgtk-3-dev; then
              exit 0
            fi
            echo "Linux dependency install attempt $attempt failed; retrying..." >&2
            sleep $((attempt * 5))
          done
          exit 1
      - name: Generate and build Linux project
        run: |
          project="$RUNNER_TEMP/notes_app"
          flutter create --no-pub --platforms=linux --org com.hyydra "$project"
          cp pubspec.yaml "$project/"
          cp -R lib/. "$project/lib/"
          cd "$project"
          flutter pub get
          flutter build linux --release

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
      - run: flutter pub get
      - run: flutter build windows
      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          $version = (Select-String '^version:\s*([0-9.]+)' pubspec.yaml).Matches.Groups[1].Value
          & $iscc "/DMyAppVersion=$version" installer/pennino.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
