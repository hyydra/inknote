name: Build Android, Linux and Windows
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'inknote/**'
    paths:
      - '.github/workflows/android-apk.yml'
      - 'android_widget/**'
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'

permissions:
  contents: read

jobs:
  android-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
      - name: Generate Android and Linux projects
        run: |
          flutter create --no-pub --platforms=android,linux --org com.hyydra "$RUNNER_TEMP/inknote"
          project="$RUNNER_TEMP/inknote"
          android="$project/android/app/src/main"
          sed -i 's/ndkVersion = flutter.ndkVersion/ndkVersion = "27.0.12077973"/' "$project/android/app/build.gradle.kts"
          cp pubspec.yaml "$project/"
          cp -R lib/. "$project/lib/"
          cp android_widget/kotlin/*.kt "$android/kotlin/com/hyydra/inknote/"
          cp -R android_widget/res/. "$android/res/"
          python3 - "$android/AndroidManifest.xml" <<'PY'
          import sys
          from pathlib import Path

          manifest = Path(sys.argv[1])
          receiver = Path("android_widget/manifest_snippet.xml").read_text().split("\n", 1)[1]
          text = manifest.read_text().replace('android:label="inknote"', 'android:label="InkNote"')
          manifest.write_text(text.replace("</application>", receiver + "    </application>"))
          PY
      - name: Test and build Android and Linux
        run: |
          dart test/autosave_controller_test.dart
          dart test/canvas_editing_test.dart
          dart test/note_data_test.dart
          dart test/note_store_test.dart
          dart test/note_store_failure_test.dart
          dart test/stroke_commit_test.dart
          cd "$RUNNER_TEMP/inknote"
          flutter pub get
          flutter build apk --debug
          flutter build linux --release
          cp build/app/outputs/flutter-apk/app-debug.apk "$RUNNER_TEMP/InkNote.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: InkNote-Android
          path: ${{ runner.temp }}/InkNote.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: InkNote-Linux
          path: ${{ runner.temp }}/inknote/build/linux/x64/release/bundle
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
      - name: Generate and build Windows project
        shell: pwsh
        run: |
          $project = Join-Path $env:RUNNER_TEMP 'inknote'
          flutter create --no-pub --platforms=windows --org com.hyydra $project
          Copy-Item pubspec.yaml $project -Force
          Copy-Item 'lib\*' (Join-Path $project 'lib') -Recurse -Force
          Set-Location $project
          flutter pub get
          flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: InkNote-Windows
          path: ${{ runner.temp }}\inknote\build\windows\x64\runner\Release
          if-no-files-found: error
