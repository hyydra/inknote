name: notes_app
description: A handwriting-first note app for Android, Linux and Windows.
publish_to: none
version: 0.4.23+27
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  crypto: ^3.0.8
  file_selector: ^1.0.4
  flutter:
    sdk: flutter
  path_provider: ^2.1.5
  uuid: ^4.5.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  image_path: assets/pennino-icon.png
  min_sdk_android: 23
  windows:
    generate: true
    image_path: assets/pennino-icon.png
    icon_size: 256
